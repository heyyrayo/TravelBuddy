<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .material-symbols-outlined.fill {
            font-variation-settings: 'FILL' 1, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        
        /* Custom Toggle Switch Styles */
        .toggle-checkbox:checked + .toggle-label {
            @apply bg-primary;
        }
        .toggle-checkbox:checked + .toggle-label .toggle-dot {
            transform: translateX(1.25rem);
        }

<body class="bg-surface text-on-surface font-body-lg antialiased min-h-screen relative bg-topo">
<!-- Header (Task-Focused / Linear context - no bottom nav) -->
<header class="sticky top-0 w-full z-50 bg-surface/90 backdrop-blur-md border-b border-surface-variant/30 px-margin-mobile h-16 flex items-center justify-between">
<div class="flex items-center">
<button class="w-10 h-10 flex items-center justify-center -ml-2 rounded-full text-on-surface hover:bg-surface-container-high transition-colors active:scale-95 duration-200 ease-in-out">
<span class="material-symbols-outlined" style="font-size: 24px;">arrow_back</span>
</button>
<h1 class="ml-2 font-headline-lg-mobile text-headline-lg-mobile text-primary tracking-tight">Settings</h1>
</div>
</header>
<!-- Main Content Canvas -->
<main class="px-margin-mobile py-lg pb-xxl max-w-2xl mx-auto space-y-xl">
<!-- Preferences Group -->
<section>
<h2 class="font-label-md text-label-md text-primary uppercase tracking-widest px-4 mb-4">Preferences</h2>
<div class="bg-surface-container-lowest rounded-[24px] shadow-sm border border-surface-variant/50 overflow-hidden flex flex-col">
<!-- Dark Mode Toggle -->
<label class="flex items-center justify-between p-4 hover:bg-surface-container-low transition-colors cursor-pointer group">
<div class="flex items-center gap-md">
<div class="w-10 h-10 rounded-full bg-primary-fixed/30 flex items-center justify-center text-primary group-hover:scale-105 transition-transform">
<span class="material-symbols-outlined fill">dark_mode</span>
</div>
<span class="font-body-lg text-body-lg text-on-surface">Dark Mode</span>
</div>
<div class="relative inline-block w-12 h-6 align-middle select-none transition duration-200 ease-in">
<input class="toggle-checkbox absolute block w-6 h-6 rounded-full bg-white border-4 appearance-none cursor-pointer z-10 opacity-0" name="toggle" type="checkbox"/>
<div class="toggle-label block overflow-hidden h-6 rounded-full bg-surface-variant cursor-pointer transition-colors duration-300">
<span class="toggle-dot absolute top-1 left-1 bg-surface-container-lowest w-4 h-4 rounded-full shadow-sm transition-transform duration-300"></span>
</div>
</div>
</label>
<div class="h-px bg-surface-variant/50 w-full ml-16"></div>
<!-- Language Selection -->
<button class="flex items-center justify-between p-4 hover:bg-surface-container-low transition-colors cursor-pointer group text-left w-full">
<div class="flex items-center gap-md">
<div class="w-10 h-10 rounded-full bg-primary-fixed/30 flex items-center justify-center text-primary group-hover:scale-105 transition-transform">
<span class="material-symbols-outlined">language</span>
</div>
<span class="font-body-lg text-body-lg text-on-surface">Language</span>
</div>
<div class="flex items-center gap-2 text-on-surface-variant">
<span class="font-body-md text-body-md">English</span>
<span class="material-symbols-outlined text-[20px]">chevron_right</span>
</div>
</button>
<div class="h-px bg-surface-variant/50 w-full ml-16"></div>
<!-- Notifications Toggle -->
<label class="flex items-center justify-between p-4 hover:bg-surface-container-low transition-colors cursor-pointer group">
<div class="flex items-center gap-md">
<div class="w-10 h-10 rounded-full bg-secondary-container/30 flex items-center justify-center text-secondary group-hover:scale-105 transition-transform">
<span class="material-symbols-outlined fill">notifications</span>
</div>
<span class="font-body-lg text-body-lg text-on-surface">Notifications</span>
</div>
<div class="relative inline-block w-12 h-6 align-middle select-none transition duration-200 ease-in">
<input checked="" class="toggle-checkbox absolute block w-6 h-6 rounded-full bg-white border-4 appearance-none cursor-pointer z-10 opacity-0" name="toggle" type="checkbox"/>
<div class="toggle-label block overflow-hidden h-6 rounded-full bg-surface-variant cursor-pointer transition-colors duration-300">
<span class="toggle-dot absolute top-1 left-1 bg-surface-container-lowest w-4 h-4 rounded-full shadow-sm transition-transform duration-300"></span>
</div>
</div>
</label>
</div>
</section>
<!-- Privacy & Security Group -->
<section>
<h2 class="font-label-md text-label-md text-primary uppercase tracking-widest px-4 mb-4">Privacy &amp; Security</h2>
<div class="bg-surface-container-lowest rounded-[24px] shadow-sm border border-surface-variant/50 overflow-hidden flex flex-col">
<!-- Privacy Policy -->
<button class="flex items-center justify-between p-4 hover:bg-surface-container-low transition-colors cursor-pointer group text-left w-full">
<div class="flex items-center gap-md">
<div class="w-10 h-10 rounded-full bg-tertiary/10 flex items-center justify-center text-tertiary group-hover:scale-105 transition-transform">
<span class="material-symbols-outlined">policy</span>
</div>
<span class="font-body-lg text-body-lg text-on-surface">Privacy Policy</span>
</div>
<span class="material-symbols-outlined text-[20px] text-on-surface-variant">chevron_right</span>
</button>
<div class="h-px bg-surface-variant/50 w-full ml-16"></div>
<!-- Permissions -->
<button class="flex items-center justify-between p-4 hover:bg-surface-container-low transition-colors cursor-pointer group text-left w-full">
<div class="flex items-center gap-md">
<div class="w-10 h-10 rounded-full bg-tertiary/10 flex items-center justify-center text-tertiary group-hover:scale-105 transition-transform">
<span class="material-symbols-outlined">lock</span>
</div>
<span class="font-body-lg text-body-lg text-on-surface">Permissions</span>
</div>
<span class="material-symbols-outlined text-[20px] text-on-surface-variant">chevron_right</span>
</button>
</div>
</section>
<!-- Support Group -->
<section>
<h2 class="font-label-md text-label-md text-primary uppercase tracking-widest px-4 mb-4">Support</h2>
<div class="bg-surface-container-lowest rounded-[24px] shadow-sm border border-surface-variant/50 overflow-hidden flex flex-col">
<!-- Help Center -->
<button class="flex items-center justify-between p-4 hover:bg-surface-container-low transition-colors cursor-pointer group text-left w-full">
<div class="flex items-center gap-md">
<div class="w-10 h-10 rounded-full bg-primary-fixed/30 flex items-center justify-center text-primary group-hover:scale-105 transition-transform">
<span class="material-symbols-outlined">help</span>
</div>
<span class="font-body-lg text-body-lg text-on-surface">Help Center</span>
</div>
<span class="material-symbols-outlined text-[20px] text-on-surface-variant">chevron_right</span>
</button>
<div class="h-px bg-surface-variant/50 w-full ml-16"></div>
<!-- About TravelBuddy -->
<button class="flex items-center justify-between p-4 hover:bg-surface-container-low transition-colors cursor-pointer group text-left w-full">
<div class="flex items-center gap-md">
<div class="w-10 h-10 rounded-full bg-primary-fixed/30 flex items-center justify-center text-primary group-hover:scale-105 transition-transform">
<span class="material-symbols-outlined">info</span>
</div>
<span class="font-body-lg text-body-lg text-on-surface">About TravelBuddy</span>
</div>
<span class="font-body-md text-body-md text-on-surface-variant mr-2">v2.4.1</span>
</button>
</div>
</section>
<div class="w-full flex justify-center pt-8 pb-4">
<button class="font-label-lg text-label-lg text-error hover:bg-error-container/30 px-6 py-3 rounded-full transition-colors flex items-center gap-2">
<span class="material-symbols-outlined">logout</span>
                Sign Out
            </button>
</div>
</main>
