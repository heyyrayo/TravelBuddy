<script>
        function nextScreen(currentScreenIndex) {
            document.getElementById(`screen-${currentScreenIndex}`).classList.remove('active');
            document.getElementById(`screen-${currentScreenIndex + 1}`).classList.add('active');
        }

        function skipOnboarding() {
            // Logic to bypass onboarding
            document.getElementById(`screen-1`).classList.remove('active');
            document.getElementById(`screen-2`).classList.remove('active');
            document.getElementById(`screen-3`).classList.add('active');
        }
        
        function completeOnboarding() {
            // Final action
            console.log("Onboarding Complete");
        }
    </script>
