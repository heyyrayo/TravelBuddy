name: travelbuddy_india
description: "TravelBuddy - Smart travel planning for India"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  http: ^1.5.0
  google_fonts: ^6.2.1
  material_symbols_icons: ^4.2719.3
  go_router: ^14.2.0
  provider: ^6.1.2
  shared_preferences: ^2.2.3
  flutter_svg: ^2.0.10
  cached_network_image: ^3.3.1
  connectivity_plus: ^6.0.5
  intl: ^0.19.0
  supabase_flutter: ^2.17.2
  geolocator: ^14.0.3
  flutter_markdown: ^0.7.7+1
  sqflite: ^2.4.4
  path: ^1.9.1
  path_provider: ^2.1.6
  flutter_map: ^8.3.2
  latlong2: ^0.10.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/databases/nidhi_accommodation.db
    - assets/databases/travelbuddy_recommendations.db
    - assets/databases/travelbuddy_recommendations_experience_v1.db
flutter_launcher_icons:
  image_path: "assets/images/travelbuddy_icon.png"
  android: "ic_launcher"
  min_sdk_android: 21
  ios: true
    - assets/databases/travelbuddy_destination_details.db

