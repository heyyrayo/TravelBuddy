name: travelbuddy_india
description: "TravelBuddy - Smart travel planning for India"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  google_fonts: ^6.2.1
  material_symbols_icons: ^4.2719.3
  go_router: ^14.2.0
  provider: ^6.1.2
  shared_preferences: ^2.2.3
  flutter_svg: ^2.0.10
  cached_network_image: ^3.3.1
  connectivity_plus: ^6.0.5
  intl: ^0.19.0
  supabase_flutter: ^2.17.2
  geolocator: ^14.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  assets:
    - assets/images/

flutter_launcher_icons:
  image_path: "assets/images/travelbuddy_icon.png"
  android: "ic_launcher"
  min_sdk_android: 21
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/images/travelbuddy_icon.png"
  ios: true