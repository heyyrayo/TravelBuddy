publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  google_fonts: ^6.2.1
  material_symbols_icons: ^4.2719.3
  go_router: ^14.2.0
  provider: ^6.1.2
  shared_preferences: ^2.2.3
